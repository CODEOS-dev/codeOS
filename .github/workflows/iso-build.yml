name: ISO 定制构建 / Custom ISO Build

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: iso-build-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: write

jobs:
  check-label:
    name: 检查标签 / Check Label
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.should_build }}
      issue_number: ${{ steps.filter.outputs.issue_number }}
    steps:
      - id: filter
        run: |
          NUMBER="${{ github.event.issue.number }}"
          LABELS=$(gh api repos/${{ github.repository }}/issues/${NUMBER}/labels --jq '.[].name' 2>/dev/null || true)
          if echo "$LABELS" | grep -q "iso-build"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "✅ Issue #$NUMBER has iso-build label"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "⛔ Skipping (no iso-build label)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  parse-and-confirm:
    name: 解析请求 / Parse Request
    runs-on: ubuntu-latest
    needs: check-label
    if: needs.check-label.outputs.should_build == 'true'
    outputs:
      build_type: ${{ steps.parse.outputs.build_type }}
      extra_packages_json: ${{ steps.parse.outputs.extra_packages_json }}
      validation_ok: ${{ steps.parse.outputs.validation_ok }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        run: |
          ISSUE_NUMBER="${{ needs.check-label.outputs.issue_number }}"
          BODY=$(gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER} --jq '.body' 2>/dev/null)

          # 提取额外包：直接抓 ``` markdown code block 里的非注释行
          # GitHub Issue 模板渲染后 section 标题格式不稳定，所以用这种方式最鲁棒
          EXTRA=$(echo "$BODY" \
            | sed -n '/```/,/```/p' \
            | grep -v '^```' \
            | sed '/^[[:space:]]*#/d' \
            | sed '/^[[:space:]]*$/d' \
            | sed 's/^[[:space:]]*- //')

          # 安全正则校验：允许字母数字下划线连字符点号 + aur: 前缀
          VALID=""
          INVALID=""
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            pkg=$(echo "$pkg" | xargs)
            if echo "$pkg" | grep -qE '^(aur:)?[a-zA-Z0-9][a-zA-Z0-9._+-]*$'; then
              VALID="$VALID $pkg"
            else
              INVALID="$INVALID $pkg"
            fi
          done <<< "$EXTRA"

          # 有额外包 = custom，没额外包 = standard
          if [ -n "$VALID" ]; then
            BUILD_TYPE="custom"
          else
            BUILD_TYPE="standard"
          fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          # 构建 JSON array
          VALID_JSON="["
          FIRST=true
          for pkg in $VALID; do
            if $FIRST; then FIRST=false; else VALID_JSON+=","; fi
            VALID_JSON+="\"$pkg\""
          done
          VALID_JSON+="]"
          echo "extra_packages_json=$VALID_JSON" >> "$GITHUB_OUTPUT"

          if [ -n "$INVALID" ]; then
            echo "validation_ok=false" >> "$GITHUB_OUTPUT"
            echo "❌ Invalid packages: $INVALID"
          else
            echo "validation_ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ Build type: $BUILD_TYPE, Valid packages: $VALID"
          fi

      - if: steps.parse.outputs.validation_ok == 'true'
        run: |
          ISSUE_NUMBER="${{ needs.check-label.outputs.issue_number }}"
          BUILD_TYPE="${{ steps.parse.outputs.build_type }}"
          PKGS="${{ steps.parse.outputs.extra_packages_json }}"
          [ "$BUILD_TYPE" = "custom" ] && TYPE_TEXT="定制版 / Custom" || TYPE_TEXT="常规版 / Standard"
          [ "$BUILD_TYPE" = "standard" ] && PKGS="[]"
          {
            echo "### ✅ 构建请求已接收 / Build request received"
            echo ""
            echo "**构建类型 / Build type**: $TYPE_TEXT"
            echo ""
            echo "**基础 ISO**: 完整 codeOS 系统（Hyprland + Quickshell + 所有 CLI + Shell 插件 + 默认配置）"
            echo "**Base ISO**: Full codeOS (Hyprland + Quickshell + all CLI + Shell plugins + default config)"
            echo ""
            echo "**额外包 / Extra packages**:"
            echo "\`\`\`json"
            echo "$PKGS"
            echo "\`\`\`"
            echo ""
            echo "⏳ 预计 15-25 分钟完成 / ETA 15-25 min"
          } > /tmp/issue_comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue_comment.md --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.parse.outputs.validation_ok != 'true'
        run: |
          ISSUE_NUMBER="${{ needs.check-label.outputs.issue_number }}"
          {
            echo "### ❌ 包名校验失败 / Package validation failed"
            echo ""
            echo "请检查额外包名称（只能含字母数字、下划线、连字符、点号；AUR 用 \`aur:包名\`）。"
            echo ""
            echo "Please close and open a new issue."
          } > /tmp/issue_comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue_comment.md --repo "${{ github.repository }}"
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "invalid"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-iso:
    name: 构建 ISO / Build ISO
    runs-on: ubuntu-latest
    needs: [check-label, parse-and-confirm]
    if: |
      needs.check-label.outputs.should_build == 'true' &&
      needs.parse-and-confirm.outputs.validation_ok == 'true'
    timeout-minutes: 60
    outputs:
      iso_name: ${{ steps.artifact.outputs.iso_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 / Prepare
        id: prep
        run: |
          mkdir -p build/workdir/{packages,airootfs,efiboot/loader,grub,i686-pc,any,out}
          cat install/omarchy-base.packages install/omarchy-other.packages \
            | sed '/^#/d' | sed '/^$/d' | sort -u > build/workdir/packages/base.txt
          EXTRA="${{ needs.parse-and-confirm.outputs.extra_packages_json }}"
          echo "$EXTRA" | python3 -c "
          import sys, json
          for p in json.load(sys.stdin):
              print(p[4:] if p.startswith('aur:') else p)
          " >> build/workdir/packages/base.txt
          sort -u build/workdir/packages/base.txt -o build/workdir/packages/base.txt
          echo "📦 基础包+额外包: $(wc -l < build/workdir/packages/base.txt) 个"
          mkdir -p build/workdir/airootfs/usr/share/omarchy
          for d in bin shell themes default config install etc plans default/agents skills; do
            [ -d "$d" ] && cp -r "$d" build/workdir/airootfs/usr/share/omarchy/
          done
          for f in version logo.svg README.md; do
            [ -f "$f" ] && cp "$f" build/workdir/airootfs/usr/share/omarchy/ 2>/dev/null || true
          done
          mkdir -p build/workdir/airootfs/usr/local/bin
          for cmd in bin/*; do
            ln -sf "/usr/share/omarchy/bin/$(basename "$cmd")" "build/workdir/airootfs/usr/local/bin/$(basename "$cmd")"
          done
          ln -sf "/usr/share/omarchy/bin/omarchy" "build/workdir/airootfs/usr/local/bin/develop"
          mkdir -p build/workdir/airootfs/etc/profile.d
          echo 'export OMARCHY_PATH=/usr/share/omarchy' > build/workdir/airootfs/etc/profile.d/codeos.sh
          echo 'export PATH="$OMARCHY_PATH/bin:$PATH"' >> build/workdir/airootfs/etc/profile.d/codeos.sh
          chmod +x build/workdir/airootfs/etc/profile.d/codeos.sh
          mkdir -p build/workdir/airootfs/etc/pacman.d
          cat default/pacman/mirrorlist-stable default/pacman/mirrorlist-rc default/pacman/mirrorlist-edge \
            | sed '/^#/d' | sed '/^$/d' > build/workdir/airootfs/etc/pacman.d/mirrorlist
          echo 'LANG=zh_CN.UTF-8' > build/workdir/airootfs/etc/locale.conf
          echo 'LANGUAGE=zh_CN:zh:en_US:en' >> build/workdir/airootfs/etc/locale.conf
          cat >> build/workdir/airootfs/root/.bashrc << 'EOF'
          export OMARCHY_PATH=/usr/share/omarchy
          export PATH="$OMARCHY_PATH/bin:$PATH"
          alias develop=omarchy
          EOF
          CODEOS_SIZE=$(du -sh build/workdir/airootfs/usr/share/omarchy | cut -f1)
          echo "✅ codeOS airootfs ($CODEOS_SIZE)"
          cp -rn build/profile/* build/workdir/ 2>/dev/null || true

      - name: Docker 构建 / Build in Docker
        run: |
          ISSUE="${{ needs.check-label.outputs.issue_number }}"
          BUILD_TYPE="${{ needs.parse-and-confirm.outputs.build_type }}"
          TS=$(date +%Y%m%d-%H%M)
          ISO_NAME="codeOS-${BUILD_TYPE}-issue${ISSUE}-${TS}.iso"
          echo "iso_name=$ISO_NAME" >> "$GITHUB_ENV"
          docker run --rm --privileged \
            -v "$PWD/build/workdir:/workdir" \
            -v "$PWD/out:/out" \
            archlinux:latest \
            bash -c '
          set -e
          pacman-key --init && pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso mkarchiso
          cd /workdir
          echo "#!/bin/bash" > profiledef.sh
          echo 'iso_name="codeOS"' >> profiledef.sh
          echo 'iso_label="codeOS '"$(date +%Y%m)"'" >> profiledef.sh
          echo 'iso_publisher="codeOS <https://github.com/CODEOS-dev/codeOS>"' >> profiledef.sh
          echo 'iso_application="codeOS Live ISO"' >> profiledef.sh
          echo 'iso_version="'"$(date +%Y.%m.%d)"'" >> profiledef.sh
          echo 'install_dir="arch"' >> profiledef.sh
          chmod +x profiledef.sh
          mkarchiso -v -w /tmp/iso-work -o /out \
            -C /workdir/packages/base.txt \
            -L "codeOS Build #'"$ISSUE"'" \
            -A x86_64
          mv /out/codeOS-*.iso "/out/'"$ISO_NAME"'" 2>/dev/null || true
          ls -lh /out/
          ' 2>&1 | tail -60

      - name: 上传 / Upload
        id: artifact
        if: always()
        run: |
          ISO=$(ls out/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            NAME=$(basename "$ISO")
            SIZE=$(du -h "$ISO" | cut -f1)
            echo "✅ $NAME ($SIZE)"
            echo "iso_name=$NAME" >> "$GITHUB_OUTPUT"
          else
            echo "❌ No ISO"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.artifact.outcome == 'success'
        with:
          name: ${{ steps.artifact.outputs.iso_name }}
          path: out/*.iso
          retention-days: 14

  post-success:
    name: 回传成功 / Post Success
    runs-on: ubuntu-latest
    needs: [build-iso]
    if: needs.build-iso.result == 'success'
    steps:
      - run: |
          ISSUE="${{ needs.check-label.outputs.issue_number }}"
          ISO_NAME="${{ needs.build-iso.outputs.iso_name }}"
          DL_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          {
            echo "### ✅ ISO 构建完成 / Build complete"
            echo ""
            echo "**文件名 / File**: \`$ISO_NAME\`"
            echo "**类型 / Type**: ${{ needs.parse-and-confirm.outputs.build_type }}"
            echo ""
            echo "**下载 / Download**: [点击下载 (14 天有效)]($DL_URL)"
            echo ""
            echo "✅ 包含完整 codeOS 系统 + 基础包 + 额外追加包"
            echo "✅ Full codeOS + base packages + extra packages included"
            echo ""
            echo "⏱ 10 小时无反馈将自动关闭 / Auto-close in 10h if no feedback"
          } > /tmp/issue_comment.md
          gh issue comment "$ISSUE" --body-file /tmp/issue_comment.md --repo "${{ github.repository }}"
          gh issue edit "$ISSUE" --remove-label iso-build --add-label iso-delivered --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-failure:
    name: 报告失败 / Report Failure
    runs-on: ubuntu-latest
    # 不依赖任何 job，直接基于 run 状态动态判断
    if: always()
    steps:
      - name: 判断哪一步挂了 + 生成反馈 / Detect failure stage
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/$RUN_ID"
          ISSUE="${{ github.event.issue.number }}"

          # 拉所有 job 状态
          STATUSES=$(gh api repos/$REPO/actions/runs/$RUN_ID/jobs \
            --jq '[.jobs[] | "\(.name)=\(.conclusion)"] | join("\n")' 2>/dev/null)
          echo "$STATUSES"

          FAILED_STAGE="(unknown)"
          FAILED_JOBS=""

          # 按优先级判断哪个 job 挂了
          echo "$STATUSES" | grep -q '解析请求.*failure' && FAILED_STAGE="parse-and-confirm"
          echo "$STATUSES" | grep -q '构建 ISO.*failure' && FAILED_STAGE="build-iso"
          echo "$STATUSES" | grep -q '检查标签.*failure' && FAILED_STAGE="check-label"

          FAILED_JOBS=$(gh api repos/$REPO/actions/runs/$RUN_ID/jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null)
          [ -z "$FAILED_JOBS" ] && FAILED_JOBS="(无 / none)"

          # 收集失败 step 的 annotations
          ANNOTATIONS=$(gh api repos/$REPO/actions/runs/$RUN_ID/jobs \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | "\(.name): \(.annotations[].message // "")"] | join("\n")' 2>/dev/null \
            | head -30)
          [ -z "$ANNOTATIONS" ] && ANNOTATIONS="(无注解，查看完整日志 / no annotations, see full run log)"

          # 构建预填 bug report
          {
            echo "### Run URL"
            echo "$RUN_URL"
            echo ""
            echo "### Failed Stage"
            echo "$FAILED_STAGE"
            echo ""
            echo "### Error Log"
            echo '```'
            echo "$ANNOTATIONS"
            echo '```'
          } > /tmp/bug_body.txt

          python3 -c "import urllib.parse as u; b=open('/tmp/bug_body.txt').read(); print('${{ github.server }}/${REPO}/issues/new?title='+u.quote('Build Failure - #${ISSUE} ('+ '$FAILED_STAGE' + ')')+'&body='+u.quote(b)+'&labels=bug,build-failure'+'&template=build-bug.yml')" > /tmp/bug_url.txt
          BUG_URL=$(cat /tmp/bug_url.txt)

          {
            echo "### ❌ 构建发生意外导致失败 / Build failed unexpectedly"
            echo ""
            echo "**失败阶段 / Failed stage**: $FAILED_STAGE"
            echo "**失败 Jobs / Failed jobs**: $FAILED_JOBS"
            echo ""
            echo "**Actions Run**: [$RUN_URL]($RUN_URL)"
            echo ""
            echo "**错误摘要 / Error summary**:"
            echo ""
            echo '```'
            echo "$ANNOTATIONS"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "### 🐛 快速反馈 / Quick Report"
            echo ""
            echo "点击下方按钮，错误信息已自动预填到 bug report 模板。"
            echo "Click the button below — error details are pre-filled in the bug report template."
            echo ""
            echo "[**📋 自动提交反馈 / Auto-fill Bug Report**]($BUG_URL)"
          } > /tmp/issue_comment.md

          # 只有真正有 failure 才评论和打标签
          if echo "$STATUSES" | grep -q 'failure'; then
            echo "检测到失败，发评论..."
            gh issue comment "$ISSUE" --body-file /tmp/issue_comment.md --repo "$REPO"
            gh issue edit "$ISSUE" --remove-label iso-build --repo "$REPO"
          else
            echo "没有 failure job，跳过（可能全部 success 或 skip）"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
