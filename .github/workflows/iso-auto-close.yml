name: Issue 自动关闭 / Auto Close Delivered Issues

# Run every hour. Close delivered iso-build issues with no activity for 10h.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  auto-close:
    name: 检查并关闭 / Check and Close
    runs-on: ubuntu-latest
    steps:
      - name: 列出已交付的 Issue / List delivered issues
        id: list
        run: |
          # Get all open issues with iso-delivered label
          ISSUES=$(gh issue list \
            --label "iso-delivered" \
            --state open \
            --limit 100 \
            --json number,url,updatedAt,title \
            --repo "${{ github.repository }}" 2>/dev/null || echo "[]")

          COUNT=$(echo "$ISSUES" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "Found $COUNT open issues with iso-delivered label"
          echo "$ISSUES"

      - name: 遍历并关闭超时 Issue / Iterate and close
        run: |
          NOW=$(date -u +%s)
          TEN_HOURS=$((10 * 3600))

          echo "$ISSUES" | python3 -c "
import sys, json
issues = json.load(sys.stdin)
for it in issues:
    print(f'{it[\"number\"]} {it[\"updatedAt\"]}')
" | while read -r NUM UPDATED_AT; do
            UPD_TS=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            DIFF=$((NOW - UPD_TS))
            HOURS=$((DIFF / 3600))

            echo "Issue #$NUM: last activity ${HOURS}h ago"

            if [ "$DIFF" -gt "$TEN_HOURS" ]; then
              echo "  → 超时，关闭 / Expired, closing"
              COMMENT=$(cat << EOF
### 🕐 自动关闭 / Auto-closed

此 Issue 已交付 ISO 下载链接，并且超过 **10 小时** 没有进一步反馈，故自动关闭。
This issue has been delivered and had no further activity for over **10 hours**, so it closes automatically.

如果还有问题或需要定制新版本，请新建 Issue。
If you have more questions or need a new custom build, please open a new issue.

— codeOS Bot 🤖
EOF
)
              gh issue comment "$NUM" --body "$COMMENT" --repo "${{ github.repository }}" || true
              gh issue close "$NUM" --repo "${{ github.repository }}" || true
            else
              REMAIN=$(( (TEN_HOURS - DIFF) / 3600 ))
              echo "  → 还剩 ${REMAIN}h / ${HOURS}h passed, keeping open"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
