name: Issue 自动关闭 / Auto Close Delivered Issues

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  auto-close:
    name: 检查并关闭 / Check and Close
    runs-on: ubuntu-latest
    steps:
      - name: 遍历已交付 Issue / Scan delivered issues
        run: |
          NOW=$(date -u +%s)
          TEN_HOURS=$((10 * 3600))
          REPO="${{ github.repository }}"
          ISSUES=$(gh issue list \
            --label "iso-delivered" \
            --state open \
            --limit 100 \
            --json number,updatedAt \
            --repo "$REPO" 2>/dev/null || echo "[]")
          echo "$ISSUES" | python3 -c "import sys,json; [print(i['number']+' '+i['updatedAt']) for i in json.load(sys.stdin)]" | while read -r NUM UPDATED_AT; do
            UPD_TS=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            DIFF=$((NOW - UPD_TS))
            HOURS=$((DIFF / 3600))
            echo "Issue #$NUM: ${HOURS}h since last activity"
            if [ "$DIFF" -gt "$TEN_HOURS" ]; then
              echo "  → Closing"
              {
                echo "### 🕐 自动关闭 / Auto-closed"
                echo ""
                echo "此 Issue 已交付 ISO 下载链接，并且超过 **10 小时** 没有进一步反馈，故自动关闭。"
                echo "This issue has been delivered and had no activity for over **10 hours**, auto-closing."
                echo ""
                echo "如有新需求请新建 Issue / Open a new issue for new requests."
                echo ""
                echo "— codeOS Bot"
              } > /tmp/close_comment.md
              gh issue comment "$NUM" --body-file /tmp/close_comment.md --repo "$REPO" || true
              gh issue close "$NUM" --repo "$REPO" || true
            else
              echo "  → Keeping open"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
